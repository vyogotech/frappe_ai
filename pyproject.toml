[project]
name = "frappe_ai"
authors = [
    { name = "Vyogo", email = "developers@vyogo.com"}
]
description = "In-desk AI assistant for Frappe/ERPNext — streams responses from a configured AI agent into a chat sidebar."
requires-python = ">=3.14,<3.15"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # the bound frappe version-16 puts on the same package, whose venv this app is installed into
    "requests~=2.33.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# the table bench reads (bench 5.29.1 app.py:547, get_required_frappe_version); a comment is not read
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.pyrefly]
# `frappe` is provided by the bench at runtime, not installed in the local venv.
# Treat it as Any only when the import cannot be resolved.
# erpnext is the same: present on a site that has it, never in this venv (see api/chat.py, _default_currency).
ignore-missing-imports = ["frappe", "frappe.*", "erpnext", "erpnext.*"]

[tool.ruff]
line-length = 110
# one below requires-python on purpose: at py314 the formatter writes PEP 758 `except A, B:`, which
# every analyser on an older interpreter (uvx defaults to 3.13) refuses to parse
target-version = "py313"
# 0.15 reads a tab-indented "word: text" comment as commented-out code (ERA001)
required-version = ">=0.16"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
    "S110",   # try-except-pass: a failure swallowed with no log
    "BLE001", # blind `except Exception`; a deliberate one carries a noqa saying why nothing may escape
    "E722",   # bare `except:`
    "T20",    # print() instead of the site logger
    "G",      # an f-string or .format() in a logging call, which breaks log aggregation by message
    "ERA001", # commented-out code
    "TD003",  # a TODO with no issue link
    "FIX002", # a TODO left in the tree
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[dependency-groups]
# the checks, in the lockfile, so CI and a developer run the same versions
dev = [
    "import-linter>=2.15,<3",
    "pyrefly>=1.3.1,<2",
    "ruff>=0.16,<0.17",
    "types-requests>=2.33.0.20260513",
]
