exclude: 'node_modules|.git'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: "frappe_ai.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.1
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: local
    hooks:
      # mirrors-prettier is archived upstream and its last rev pins Prettier 2, whose
      # output differs from the Prettier 3 in package.json; run the repo's own copy.
      - id: prettier
        name: "Run prettier"
        entry: npx prettier --write --ignore-unknown
        language: system
        types_or: [javascript, ts, vue, css, scss]
        exclude: |
            (?x)^(
                .*node_modules.*
            )$

      - id: eslint
        name: "Run eslint"
        entry: npx eslint --quiet
        language: system
        types_or: [javascript, ts, vue]
        exclude: |
            (?x)^(
                .*node_modules.*
            )$

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
