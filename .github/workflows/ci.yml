name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Nothing here writes to the repository; each job asks for the read it needs.
permissions: {}

concurrency:
  # Cancel older runs of the same branch when a newer commit arrives. head_ref first: a pushed branch
  # that also has a PR open fires both triggers, and only the branch name is the same in both.
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Tier 1 — static checks. ~1–2 min. Run all linters / type-checkers
  # against the working tree without spinning up a Frappe bench.
  # ──────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # Every frappe v16 release, from v16.0.0, declares requires-python >=3.14,<3.15.
          python-version: '3.14'

      # setup-node reads the yarn cache before any later step runs, so yarn has to exist first.
      # corepack ships with node and installs the version package.json names, which keeps this
      # working on any runner rather than only on images that happen to preinstall yarn.
      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # Frappe v16 frontend declares engines.node >= 24.
          node-version: '24'
          cache: 'yarn'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install Python deps (runtime + dev group)
        run: uv sync --locked --group dev

      - name: Install Node deps
        # yarn, not npm: bench installs an app's JS with `yarn install --check-files`
        # (bench 5.29.1 app.py:960), so yarn.lock is the lockfile production actually uses.
        run: yarn install --frozen-lockfile

      # The Makefile is the one definition of these checks, so CI and a developer cannot drift apart.
      - name: make lint
        run: make lint

      - name: make typecheck
        run: make typecheck

      - name: make boundaries
        run: make boundaries

      - name: make test-js
        run: make test-js

      - name: markdownlint
        run: npx --yes markdownlint-cli@0.49.1 README.md QUICKSTART.md INSTALLATION.md APP_STRUCTURE.md CONTRIBUTING.md SECURITY.md

      - name: Strict JSON validity
        run: |
          python - <<'PY'
          import json, glob, sys
          files = sorted(glob.glob('frappe_ai/**/*.json', recursive=True) + ['package.json', 'tsconfig.json', '.markdownlint.json'])
          failed = []
          for f in files:
              try:
                  json.load(open(f))
                  print(f'OK  {f}')
              except Exception as e:
                  print(f'FAIL  {f}: {e}')
                  failed.append(f)
          sys.exit(1 if failed else 0)
          PY

  # ──────────────────────────────────────────────────────────────────────
  # Tier 2 — Frappe integration. ~8–12 min. Spin up a real bench against
  # Frappe v16, install the app the same way production does
  # (`bench get-app`), build the bundle, run the test suite.
  #
  # No manual mv / pip install / apps.txt manipulation here — those are
  # exactly the bookkeeping steps that `bench get-app` exists to do for
  # us. If this job passes, the app installs cleanly under real bench.
  # ──────────────────────────────────────────────────────────────────────
  integration:
    name: Frappe v16 integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint
    permissions:
      contents: read

    services:
      mariadb:
        # 10.6 left community support on 2026-07-06; 11.8 LTS is what frappe's own CI runs.
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: travis
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis-cache:
        image: redis:8-alpine
        ports:
          - 13000:6379

      redis-queue:
        image: redis:8-alpine
        ports:
          - 11000:6379

    steps:
      # The directory name becomes the app name: bench derives it from the
      # basename of the path it clones (bench 5.29.1 app.py:113).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: frappe_ai
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # Every frappe v16 release, from v16.0.0, declares requires-python >=3.14,<3.15.
          python-version: '3.14'

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # Frappe v16 frontend declares engines.node >= 24.
          node-version: '24'

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mariadb-client \
            libmariadb-dev \
            wkhtmltopdf \
            xvfb \
            libfontconfig

      - name: Configure MariaDB for Frappe (utf8mb4 + remote root)
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -ptravis -e "
            SET GLOBAL character_set_server = 'utf8mb4';
            SET GLOBAL collation_server = 'utf8mb4_unicode_ci';
            CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED BY 'travis';
            GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;
            FLUSH PRIVILEGES;"

      - name: Install frappe-bench
        run: pip install frappe-bench==5.31.0

      - name: bench init (Frappe v16)
        run: |
          bench init \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(which python3)" \
            --frappe-branch version-16 \
            frappe-bench

      - name: Point bench at the CI Redis instances
        working-directory: frappe-bench
        run: |
          bench set-config -g redis_cache "redis://localhost:13000"
          bench set-config -g redis_queue "redis://localhost:11000"
          bench set-config -g redis_socketio "redis://localhost:13000"

      - name: Install this app via `bench get-app` (production install path)
        working-directory: frappe-bench
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          bench get-app --skip-assets "$GITHUB_WORKSPACE/frappe_ai"

      - name: Create test site
        working-directory: frappe-bench
        run: |
          bench new-site test_site.local \
            --mariadb-root-password travis \
            --admin-password admin \
            --mariadb-user-host-login-scope='%'

      - name: Install app on test site
        working-directory: frappe-bench
        run: bench --site test_site.local install-app frappe_ai

      - name: Build frontend bundle
        working-directory: frappe-bench
        run: bench build --app frappe_ai

      - name: Run unit tests
        working-directory: frappe-bench
        run: bench --site test_site.local run-tests --app frappe_ai
